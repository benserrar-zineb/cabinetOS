services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cabinetos_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://cabinetos_app:cabinetos_app_pw@postgres:5432/cabinetos_dev
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../apps/api/test:/app/apps/api/test
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
    volumes:
      - ../../apps/web/src:/app/apps/web/src
    depends_on:
      - api

volumes:
  postgres_data: